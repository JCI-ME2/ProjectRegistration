<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Registration Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
/* Body & Container */
body {
    background-color: #f0f4f8;
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
}

.container {
    max-width: 850px;
    margin: 0 auto;
    background-color: #ffffff;
    padding: 30px 35px;
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.1);
    border: 1px solid #e2e8f0;
}
.lang-flag {
  width: 60px;       
  height: 60px;      
  object-fit: cover;  
  border-radius: 50%; 
  border: 2px solid #ddd; 
  transition: transform 0.3s, box-shadow 0.3s;
}

.lang-flag:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Headings */
h1 {
    text-align: center;
    color: #8594ac;
    margin-bottom: 25px;
    font-size: 2em;
    font-weight: 700;
}

h2, h4 {
    color: #0d6efd;
    margin-top: 30px;
    margin-bottom: 15px;
    font-weight: 600;
    border-bottom: 2px solid #0d6efd33; /* subtle underline */
    padding-bottom: 5px;
}

/* Labels & Inputs */
label {
    font-weight: 500;
    color: #495057;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="number"],
textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #ced4da;
    border-radius: 6px;
    font-size: 15px;
    transition: all 0.3s ease;
}

input:focus,
textarea:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
    outline: none;
}

/* Buttons */
.submit-btn,
.add-row-btn,
.remove-row-btn {
    font-weight: 600;
    transition: all 0.3s ease;
}

.submit-btn {
    background: #0d6efd;
    color: #fff;
    border-radius: 8px;
    padding: 12px 30px;
    margin-top: 10px;
}

.submit-btn:hover {
    background-color: #0b5ed7;
}

.add-row-btn {
     background: #0d6efd;
    color: #fff;
    border-radius: 6px;
      margin-bottom: 10px;
      margin-left: 10px;
      font-size: small;
}

.add-row-btn:hover {
    background-color: #0b5ed7;
  
}

.remove-row-btn {
    background-color: #dc3545;
    border-radius: 6px;
     font-size: small;
}

.remove-row-btn:hover {
    background-color: #b02a37;
}

/* Messages */
.message {
    font-size: 15px;
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 20px;
    margin-top: 20px;
}

.success {
    background-color: #d1e7dd;
    border: 1px solid #badbcc;
    color: #0f5132;
}

.error {
    background-color: #f8d7da;
    border: 1px solid #f5c2c7;
    color: #842029;
}

/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
    font-size: 14px;
}

th, td {
    padding: 10px 12px;
    text-align: left;
}

th {
    background-color: #e9f2ff;
    color: #0d6efd;
    font-weight: 600;
}

td {
    background-color: #f8f9fa;
}

/* Checkboxes & Radios */
.checkbox-group, .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.checkbox-item, .radio-item {
    display: flex;
    align-items: center;
    font-size: small;
    gap: 6px;
}

.checkbox-item input,
.radio-item input {
    width: 18px;
    height: 18px;
    accent-color: #0d6efd;
    cursor: pointer;
}

/* Required field indicator */
.req {
    
    font-weight: 600;
    color: #b02a37;
}

/* Placeholder style */
input::placeholder,
textarea::placeholder {
    color: #adb5bd;
    font-style: italic;
}

/* Responsive adjustments */
@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
    }
}


         .table-bottom-border td, 
  .table-bottom-border th {
    border-top: none !important;
    border-left: none !important;
    border-right: none !important;
    border-bottom: none !important; 
    color: #0b7dda;
    font-family:Arial, Helvetica, sans-serif;
    font-size: x-large;
    text-align: center;
    
  }
    </style>
</head>
<body>

        <div class="ms-5 mb-4 border-bottom">

            <thead>            
                <tr>
                    <th >Illustra</th>

            </thead>
            <thead>

            </thead>

</html>
